<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friend Paint</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#5d9bd3;font:12px Tahoma,Arial;color:#111}.win{width:min(1240px,98vw);margin:15px auto;background:#ece9d8;border:1px solid #164a9a;box-shadow:4px 5px 12px #345;border-radius:7px 7px 0 0;overflow:hidden}.bar{height:34px;color:#fff;font-weight:bold;font-size:15px;padding:5px 8px;background:linear-gradient(#4aa4f7,#0751b5 55%,#2368c4);display:flex;justify-content:space-between}.buttons{display:flex;gap:3px}.buttons b{background:#eee;color:#111;border:1px solid #fff;width:24px;text-align:center;border-radius:3px}.menu{height:28px;padding:6px 10px;border-bottom:1px solid #aaa}.menu span{margin-right:20px}.top{padding:5px;border-bottom:1px solid #aaa}.top button,.tool,.side button,.account button,.comment button,.reply button,.filter button{background:linear-gradient(#fff,#ddd);border:1px solid #888;min-height:28px}.layout{display:grid;grid-template-columns:78px 1fr 245px;min-height:600px}.tools{padding:5px;background:#eee9d8;border-right:1px solid #aaa;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:4px}.tool{height:38px;font-size:19px}.tool.active{background:#c7d9ee;border:2px inset #aaa}.work{background:#777;padding:10px}.canvasbox{height:100%;background:#aaa;border:2px inset white;padding:12px;overflow:auto}canvas{display:block;background:#fff;width:760px;max-width:none}.side{padding:9px;background:#eee9d8;border-left:1px solid #aaa}.side h3{margin:3px 0 8px;color:#06458f;border-bottom:1px solid #aaa;padding-bottom:4px}.side input,.account input,.comment textarea{width:100%;height:26px;border:2px inset #fff;margin-bottom:7px}.side button,.account button{width:100%;height:31px;margin:3px 0;font-weight:bold}.preview{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:2px inset #aaa}.palette{display:flex;gap:7px;padding:7px;background:#eee9d8;border-top:1px solid #aaa}.colors{display:grid;grid-template-columns:repeat(16,22px);gap:2px}.sw{width:22px;height:22px;border:1px solid #555}.gallery{padding:12px;background:#ece9d8;border-top:1px solid #888}.gallery h2{color:#06458f;font-size:18px}.feedbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.feedbar input{height:28px;border:2px inset #fff;padding:3px 6px;flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #888;padding:6px;box-shadow:1px 1px 0 #aaa}.card img{width:100%;aspect-ratio:1;object-fit:contain;border:1px solid #ddd}.card b,.card small{display:block;margin-top:4px}.meta{color:#555}.actions{display:flex;gap:4px;margin-top:6px}.actions button{flex:1;background:#eee;border:1px solid #888;font-size:11px;padding:4px}.count{font-weight:bold}.comments,.replies{margin-top:7px;border-top:1px dotted #aaa;padding-top:5px}.commentline{padding:4px 0;border-bottom:1px dotted #ccc}.commentline b{display:inline;margin:0}.replyimg{width:100%;margin-top:5px;border:1px solid #aaa}.smallbox{background:#f7f5e9;border:1px solid #aaa;padding:6px;margin-top:6px}.smallbox input,.smallbox textarea{width:100%;border:2px inset #fff;margin-bottom:4px}.smallbox textarea{height:48px}.account{background:#f5f2e7;border:1px solid #aaa;padding:7px;margin-bottom:8px}.account .row{display:flex;gap:4px}.account .row button{flex:1}.status{padding:5px;background:#eee9d8;border-top:1px solid #aaa;font-size:11px}.hidden{display:none!important}.notice{padding:8px;background:#fff7c7;border:1px solid #b49b2b;margin-bottom:8px}.danger{background:#ffdede!important}.pagination{margin-top:10px;text-align:center}.pagination button{margin:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10}.modalbox{width:min(520px,94vw);background:#ece9d8;border:2px outset #fff;box-shadow:5px 5px 15px #333}.modalhead{background:linear-gradient(#4aa4f7,#0751b5);color:#fff;font-weight:bold;padding:6px}.modalbody{padding:12px}.modalbody textarea{width:100%;height:90px}.modalbody button{margin-top:7px}.report-reason{width:100%;height:30px}@media(max-width:850px){.layout{grid-template-columns:65px 1fr}.side{grid-column:1/-1;border-left:0;border-top:1px solid #aaa}.colors{grid-template-columns:repeat(8,22px)}}@media(max-width:500px){.layout{grid-template-columns:1fr}.tools{grid-template-columns:repeat(8,1fr);border-right:0;border-bottom:1px solid #aaa}}
<style>
/* Prevent the page from scrolling while drawing on the canvas */
canvas {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Phone layout */
@media (max-width: 600px) {
  body {
    overflow-x: hidden;
  }

  .win {
    width: 96vw !important;
    margin: 10px auto !important;
  }

  canvas {
    width: 100% !important;
    height: auto !important;
    max-width: 100%;
  }

  button {
    font-size: 14px;
    padding: 6px 8px;
  }

  input,
  textarea,
  select {
    max-width: 100%;
    box-sizing: border-box;
  }
}
</style>
</head>
<body>
<div class="win">
<div class="bar"><span>🖌️ Friend Paint — community edition</span><span class="buttons"><b>_</b><b>□</b><b>×</b></span></div>
<div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Colors</span><span>Help</span></div>
<div class="top"><button id="new">New</button> <button id="undo">Undo</button> <button id="redo">Redo</button> <button id="clear">Clear</button> <button id="png">Save PNG</button></div>
<div class="layout">
<div class="tools"><button class="tool active" data-t="pencil">✎</button><button class="tool" data-t="eraser">⌫</button><button class="tool" data-t="line">╱</button><button class="tool" data-t="rect">□</button><button class="tool" data-t="circle">○</button><button class="tool" data-t="text">A</button><button class="tool" data-t="pick">⌕</button></div>
<div class="work"><div class="canvasbox"><canvas id="c" width="760" height="520"></canvas></div></div>
<div class="side">
<h3>Friend Paint</h3><img id="prev" class="preview">
<div id="accountArea" class="account"><b>Account</b><div id="signedOut"><input id="email" type="email" placeholder="email"><input id="password" type="password" placeholder="password"><input id="username" maxlength="24" placeholder="username (sign up only)"><div class="row"><button id="signup">Sign up</button><button id="login">Log in</button></div></div><div id="signedIn" class="hidden"><div id="who"></div><button id="logout">Log out</button></div></div>
<h3>Post drawing</h3><input id="title" maxlength="40" placeholder="drawing name"><input id="artist" maxlength="24" placeholder="artist name"><button id="post">★ POST DRAWING ★</button><button id="download">Save as PNG</button><label>Brush size <input id="size" type="range" min="1" max="40" value="5"></label>
<div class="notice">Tip: sign in to like, comment, reply, report, and delete your own posts.</div>
</div></div>
<div class="palette"><div style="width:42px;height:42px;border:1px solid #333;background:#000" id="cur"></div><div class="colors" id="colors"></div><input id="custom" type="color"></div>
<div class="status" id="status">Ready.</div>
<div class="gallery"><h2>🖼️ Friend Paint Gallery</h2><div class="feedbar"><input id="search" placeholder="Search drawings or artists..."><button id="refresh">Refresh</button><button id="mine">My posts</button><button id="all">All posts</button></div><div id="authNotice" class="notice hidden"></div><div class="grid" id="gallery"></div><div class="pagination" id="pagination"></div></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead">Report drawing</div><div class="modalbody"><select id="reportReason" class="report-reason"><option>Spam</option><option>Inappropriate content</option><option>Harassment</option><option>Other</option></select><textarea id="reportDetails" maxlength="300" placeholder="Optional details"></textarea><button id="sendReport">Send report</button> <button id="closeModal">Cancel</button></div></div></div>
<script>
const SUPABASE_URL='https://mldsufddazsswxkvspmq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_3FY8Nz2KpTZLNLQM9I8Nzw_u3k9bAEx';
const db=(window.supabase&&!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');
let tool='pencil',down=false,start=null,last=null,color='#000000',history=[],future=[],currentUser=null,onlyMine=false,searchTerm='',reportDrawingId=null;
ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
const palette=['#000000','#ffffff','#777777','#cccccc','#800015','#b97a57','#ed1c24','#ff7f27','#fff200','#22b14c','#00ffff','#3f48cc','#a349a4','#ff00ff','#555555','#aaaaaa','#ff0000','#00ff00','#0000ff','#ffff00','#00ffff','#ff00ff','#ffa500','#008000','#800080','#008080','#000080','#c0c000','#ff69b4','#00a651','#4169e1','#8b4513'];
function status(x){$('status').textContent=x} function setColor(c){color=c;$('cur').style.background=c}
palette.forEach(c=>{let b=document.createElement('button');b.className='sw';b.type='button';b.style.background=c;b.title=c;b.onclick=()=>setColor(c);$('colors').appendChild(b)});setColor(color);
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
function data(){return canvas.toDataURL('image/png')} function saveHistory(){history.push(data());if(history.length>30)history.shift();future=[]} function restore(d){let i=new Image();i.onload=()=>ctx.drawImage(i,0,0);i.src=d}
function activate(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.remove('active'));document.querySelector('[data-t="'+t+'"]').classList.add('active');status('Tool: '+t)}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>activate(b.dataset.t));
canvas.addEventListener('pointerdown',e=>{let p=point(e);if(tool==='text'){let text=prompt('Text to place:');if(text){saveHistory();ctx.fillStyle=color;ctx.font='20px Arial';ctx.fillText(text,p.x,p.y)}return}if(tool==='pick'){let d=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;setColor('#'+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,'0')).join(''));return}saveHistory();down=true;start=last=p;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;let p=point(e),b=Math.max(1,+$('size').value);if(tool==='pencil'||tool==='eraser'){ctx.strokeStyle=tool==='eraser'?'#fff':color;ctx.lineWidth=tool==='eraser'?b*2:b;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}});
function finish(e){if(!down)return;down=false;let p=point(e),b=Math.max(1,+$('size').value);ctx.strokeStyle=color;ctx.lineWidth=b;ctx.lineCap='round';if(tool==='line'){ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke()}else if(tool==='rect')ctx.strokeRect(start.x,start.y,p.x-start.x,p.y-start.y);else if(tool==='circle'){let rx=(p.x-start.x)/2,ry=(p.y-start.y)/2;ctx.beginPath();ctx.ellipse(start.x+rx,start.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke()}}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>down=false);
$('undo').onclick=()=>{if(history.length){future.push(data());restore(history.pop());status('Undo')}};$('redo').onclick=()=>{if(future.length){history.push(data());restore(future.pop());status('Redo')}};
function clearCanvas(){saveHistory();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);status('Canvas cleared')} $('clear').onclick=clearCanvas;$('new').onclick=()=>confirm('Start a new drawing?')&&clearCanvas();
function download(){let a=document.createElement('a');a.download=($('title').value.trim()||'friend-paint-drawing')+'.png';a.href=data();a.click()} $('png').onclick=download;$('download').onclick=download;$('custom').oninput=e=>setColor(e.target.value);setInterval(()=>$('prev').src=data(),500);
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setAuthUI(){let on=!!currentUser;$('signedOut').classList.toggle('hidden',on);$('signedIn').classList.toggle('hidden',!on);if(on){$('who').textContent='Signed in as '+(currentUser.user_metadata?.username||currentUser.email);$('artist').value=currentUser.user_metadata?.username||'';$('authNotice').classList.add('hidden')}else{$('who').textContent=''} }
async function refreshUser(){if(!db)return;let r=await db.auth.getUser();currentUser=r.data.user||null;setAuthUI()}
$('signup').onclick=async()=>{if(!db)return status('Connect Supabase first.');let email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim()||'Friend';if(password.length<6)return status('Password must be at least 6 characters.');let r=await db.auth.signUp({email,password,options:{data:{username}}});if(r.error)return status('Sign up failed: '+r.error.message);status(r.data.session?'Account created!':'Account created. Check your email if confirmation is enabled.');await refreshUser()};
$('login').onclick=async()=>{if(!db)return status('Connect Supabase first.');let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return status('Log in failed: '+r.error.message);status('Logged in!');await refreshUser();loadGallery()};
$('logout').onclick=async()=>{await db?.auth.signOut();currentUser=null;setAuthUI();loadGallery();status('Logged out.')};
if(db)db.auth.onAuthStateChange((_e,s)=>{currentUser=s?.user||null;setAuthUI();loadGallery()});
async function like(id){if(!currentUser)return status('Log in to like drawings.');let r=await db.from('likes').insert({drawing_id:id,user_id:currentUser.id});if(r.error&&r.error.code==='23505')await db.from('likes').delete().eq('drawing_id',id).eq('user_id',currentUser.id);else if(r.error)return status(r.error.message);loadGallery()}
async function deletePost(id){if(!currentUser||!confirm('Delete this drawing?'))return;let r=await db.from('drawings').delete().eq('id',id).eq('user_id',currentUser.id);if(r.error)return status('Delete failed: '+r.error.message);status('Drawing deleted.');loadGallery()}
async function addComment(id,input){if(!currentUser)return status('Log in to comment.');let body=input.value.trim();if(!body)return;let r=await db.from('comments').insert({drawing_id:id,user_id:currentUser.id,body});if(r.error)return status('Comment failed: '+r.error.message);input.value='';loadGallery()}
async function addReply(id,input){if(!currentUser)return status('Log in to post a drawing reply.');let img=data();let r=await db.from('drawing_replies').insert({drawing_id:id,user_id:currentUser.id,image_url:img});if(r.error)return status('Reply failed: '+r.error.message);input.value='';status('Drawing reply posted!');loadGallery()}
function openReport(id){if(!currentUser)return status('Log in to report a drawing.');reportDrawingId=id;$('modal').classList.remove('hidden')}$('closeModal').onclick=()=>{$('modal').classList.add('hidden')};$('sendReport').onclick=async()=>{let r=await db.from('reports').insert({drawing_id:reportDrawingId,user_id:currentUser.id,reason:$('reportReason').value,details:$('reportDetails').value.trim()});if(r.error)return status('Report failed: '+r.error.message);$('reportDetails').value='';$('modal').classList.add('hidden');status('Report submitted. Thank you.')};
async function loadGallery(){if(!db){$('gallery').innerHTML='<div class="card">Add your Supabase Project URL and Publishable Key to connect the community gallery.</div>';return}$('gallery').innerHTML='<div class="card">Loading drawings...</div>';
let q=db.from('drawings').select('*, profiles(username), likes(user_id), comments(id,user_id,body,created_at,profiles(username)), drawing_replies(id,user_id,image_url,created_at,profiles(username))').order('created_at',{ascending:false}).limit(100);if(onlyMine&&currentUser)q=q.eq('user_id',currentUser.id);let r=await q;if(r.error){$('gallery').innerHTML='<div class="card">Database error: '+safe(r.error.message)+'</div>';return}let rows=r.data||[];if(searchTerm)rows=rows.filter(p=>(p.title+' '+(p.artist_name||'')+' '+(p.profiles?.username||'')).toLowerCase().includes(searchTerm.toLowerCase()));if(!rows.length){$('gallery').innerHTML='<div class="card">No drawings found.</div>';return}
$('gallery').innerHTML='';rows.forEach(p=>{let card=document.createElement('div');card.className='card';let likes=(p.likes||[]).length,comments=(p.comments||[]).slice(-5);let replies=(p.drawing_replies||[]).slice(-3);let own=currentUser&&p.user_id===currentUser.id;card.innerHTML='<img src="'+safe(p.image_url)+'"><b>'+safe(p.title)+'</b><small class="meta">by '+safe(p.profiles?.username||p.artist_name||'Anonymous')+' · '+new Date(p.created_at).toLocaleString()+'</small><div class="actions"><button class="like">♥ <span class="count">'+likes+'</span></button><button class="report">⚑ Report</button>'+(own?'<button class="delete danger">Delete</button>':'')+'</div><div class="comments"><b>Comments</b>'+comments.map(c=>'<div class="commentline"><b>'+safe(c.profiles?.username||'Friend')+':</b> '+safe(c.body)+'</div>').join('')+'<div class="smallbox"><input class="commentInput" maxlength="300" placeholder="Write a comment..."><button class="commentBtn">Post comment</button></div></div><div class="replies"><b>Drawing replies</b>'+replies.map(x=>'<img class="replyimg" src="'+safe(x.image_url)+'"><small class="meta">by '+safe(x.profiles?.username||'Friend')+'</small>').join('')+'<div class="smallbox"><button class="replyBtn">Reply with current canvas</button></div></div>';
card.querySelector('.like').onclick=()=>like(p.id);card.querySelector('.report').onclick=()=>openReport(p.id);if(own)card.querySelector('.delete').onclick=()=>deletePost(p.id);card.querySelector('.commentBtn').onclick=()=>addComment(p.id,card.querySelector('.commentInput'));card.querySelector('.replyBtn').onclick=()=>addReply(p.id,card.querySelector('.commentInput'));$('gallery').appendChild(card)})}
$('post').onclick=async()=>{if(!db)return status('Connect Supabase first.');if(!currentUser)return status('Log in before posting.');let btn=$('post');btn.disabled=true;let r=await db.from('drawings').insert({title:$('title').value.trim()||'Untitled',artist_name:$('artist').value.trim()||currentUser.user_metadata?.username||'Anonymous',image_url:data(),user_id:currentUser.id});btn.disabled=false;if(r.error)return status('Post failed: '+r.error.message);status('Drawing posted! ★');loadGallery()};
$('refresh').onclick=loadGallery;$('search').oninput=e=>{searchTerm=e.target.value;loadGallery()};$('mine').onclick=()=>{onlyMine=true;loadGallery()};$('all').onclick=()=>{onlyMine=false;loadGallery()};
setAuthUI();refreshUser();loadGallery();
</script></body></html>
